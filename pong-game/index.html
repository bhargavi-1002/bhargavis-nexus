<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../shared/arcade-theme.css">
<script src="../shared/arcade-sdk.js"></script>
<!-- BEGIN FULLSCREEN MOD -->

<style>
/* Injected by Fullscreen Mod */
html, body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    overflow: hidden !important;
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
    background-color: var(--bg-color, #0b0f19) !important;
}

body > .arcade-back-btn {
    z-index: 10000;
}

#gameCanvas, canvas {
    max-width: 100vw !important;
    max-height: 100vh !important;
    width: auto !important;
    height: auto !important;
    object-fit: contain !important;
}

.container, .game-container {
    width: 100vw !important;
    height: 100vh !important;
    max-width: 100% !important;
    max-height: 100% !important;
    border-radius: 0 !important;
    box-sizing: border-box !important;
    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;
    align-items: center !important;
    border: none !important;
}
</style>
<script>
// Auto-scale content for portrait and landscape
function adjustScale() {
    const containers = document.querySelectorAll('.container, .game-container, canvas');
    containers.forEach(el => {
        // Just let CSS handle the full width/height
    });
}
window.addEventListener('resize', adjustScale);
window.addEventListener('orientationchange', adjustScale);
adjustScale();
</script>

<!-- END FULLSCREEN MOD -->
</head>
<body>
    <a href="../index.html" class="arcade-back-btn">← Back to Arcade</a>
    <div class="container">
        <div class="header">
            <h1>PONG</h1>
            <div class="scoreboard">
                <div class="score-section">
                    <p class="score-label">Player</p>
                    <p class="score" id="playerScore">0</p>
                </div>
                <div class="divider">:</div>
                <div class="score-section">
                    <p class="score-label">Computer</p>
                    <p class="score" id="computerScore">0</p>
                </div>
            </div>
        </div>

        <div class="game-info">
            <p>Mouse or <strong>↑↓ Arrow Keys</strong> to control left paddle</p>
        </div>

        <canvas id="pongCanvas" width="800" height="400"></canvas>

        <div class="footer">
            <button id="startBtn" class="btn">Start Game</button>
            <button id="resetBtn" class="btn">Reset Score</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
