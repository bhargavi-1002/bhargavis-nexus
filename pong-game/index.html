<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../shared/arcade-theme.css">
<script src="../shared/arcade-sdk.js"></script>
<!-- BEGIN FULLSCREEN SCALING -->

<style>
/* Safe Fullscreen Scaling Mod V2 */
html {
    margin: 0 !important;
    padding: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    overflow: hidden !important;
}

body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    overflow: hidden !important;
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
}

body > .arcade-back-btn {
    position: absolute !important;
    top: 10px !important;
    left: 10px !important;
    z-index: 10000 !important;
}

.game-container, .container {
    transform-origin: center;
    margin: 0 !important;
}
</style>
<script>
function safeScale() {
    const container = document.querySelector('.game-container, .container');
    if (!container) return;
    
    container.style.transform = 'none';
    const rect = container.getBoundingClientRect();
    const cw = rect.width || 800;
    const ch = rect.height || 600;
    
    let padding = 10;
    const scaleX = window.innerWidth / (cw + padding);
    const scaleY = window.innerHeight / (ch + padding);
    
    const scale = Math.min(scaleX, scaleY);
    container.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', safeScale);
window.addEventListener('orientationchange', safeScale);
window.addEventListener('DOMContentLoaded', safeScale);
window.addEventListener('load', safeScale);
setTimeout(safeScale, 500);
</script>

<!-- END FULLSCREEN SCALING -->
</head>
<body>
    <a href="../index.html" class="arcade-back-btn">← Back to Arcade</a>
    <div class="container">
        <div class="header">
            <h1>PONG</h1>
            <div class="scoreboard">
                <div class="score-section">
                    <p class="score-label">Player</p>
                    <p class="score" id="playerScore">0</p>
                </div>
                <div class="divider">:</div>
                <div class="score-section">
                    <p class="score-label">Computer</p>
                    <p class="score" id="computerScore">0</p>
                </div>
            </div>
        </div>

        <div class="game-info">
            <p>Mouse or <strong>↑↓ Arrow Keys</strong> to control left paddle</p>
        </div>

        <canvas id="pongCanvas" width="800" height="400"></canvas>

        <div class="footer">
            <button id="startBtn" class="btn">Start Game</button>
            <button id="resetBtn" class="btn">Reset Score</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
