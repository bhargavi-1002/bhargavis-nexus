<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🟩 Number Guessing Game</title>
    <link rel="stylesheet" href="../shared/arcade-theme.css">
    <script src="../shared/arcade-sdk.js"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .game-container {
            background-color: #2a2a35;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { color: #4caf50; margin-top: 0; }
        .stats {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
            font-weight: bold;
            color: #00bcd4;
        }
        input[type="number"] {
            width: 60%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #444;
            border-radius: 6px;
            background-color: #1e1e24;
            color: white;
            text-align: center;
            outline: none;
        }
        input[type="number"]:focus { border-color: #4caf50; }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            width: 65%;
            transition: background 0.2s;
        }
        button:hover { background-color: #45a049; }
        .btn-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .btn-secondary {
            background-color: #00bcd4;
        }
        .btn-secondary:hover {
            background-color: #008c9e;
        }
        #message {
            margin-top: 20px;
            font-size: 18px;
            min-height: 27px;
            font-weight: bold;
        }
        .error { color: #ff5252; }
        .success { color: #ffeb3b; }
    </style>
<!-- BEGIN FULLSCREEN MOD -->

<style>

    margin: 0 !important;
    padding: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    overflow: hidden !important;
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
    background-color: var(--bg-color, #0b0f19) !important;
}

body > .arcade-back-btn {
    z-index: 10000;
}

#gameCanvas, canvas {
    max-width: 100vw !important;
    max-height: 100vh !important;
    width: auto !important;
    height: auto !important;
    object-fit: contain !important;
}

.container, .game-container {
    width: 100vw !important;
    height: 100vh !important;
    max-width: 100% !important;
    max-height: 100% !important;
    border-radius: 0 !important;
    box-sizing: border-box !important;
    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;
    align-items: center !important;
    border: none !important;

</style>
<script>
// Auto-scale content for portrait and landscape
function adjustScale() {
    const containers = document.querySelectorAll('.container, .game-container, canvas');
    containers.forEach(el => {
        // Just let CSS handle the full width/height
    });
}
window.addEventListener('resize', adjustScale);
window.addEventListener('orientationchange', adjustScale);

<!-- END FULLSCREEN MOD -->
</head>
<body>

<a href="../index.html" class="arcade-back-btn">← Back to Arcade</a>

<div class="game-container glass-panel">
    <h1>🟩 Guessing Game</h1>
    <p>I am thinking of a number between 1 and 100.</p>
    
    <div class="stats">
        <div>Attempts Left: <span id="attempts">7</span></div>
        <div>Score: <span id="score">100</span></div>
    </div>

    <input type="number" id="userGuess" min="1" max="100" placeholder="Enter 1-100">
    <br>
    <div class="btn-group">
        <button id="submitBtn" class="guess-btn" onclick="checkGuess()">Submit Guess</button>
        <button id="restartBtn" class="reset-btn btn-secondary" onclick="resetGame()">Restart Game</button>
    </div>
    
    <div id="message"></div>
</div>

<script>
    let secretNumber = Math.floor(Math.random() * 100) + 1;
    let attemptsLeft = 7;
    let score = 100;
    let gameOver = false;

    const guessInput = document.getElementById('userGuess');
    const messageDiv = document.getElementById('message');
    const attemptsSpan = document.getElementById('attempts');
    const scoreSpan = document.getElementById('score');
    const submitBtn = document.getElementById('submitBtn');
    const restartBtn = document.getElementById('restartBtn') || document.getElementById('resetBtn');

    // Allow pressing "Enter" key to submit
    if (guessInput) {
        guessInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkGuess();
        });
    }

    function checkGuess() {
        if (gameOver) {
            resetGame();
            return;
        }

        let guess = parseInt(guessInput.value, 10);

        // Validation
        if (isNaN(guess) || guess < 1 || guess > 100) {
            messageDiv.className = 'error';
            messageDiv.textContent = '❌ Enter a valid number between 1 and 100.';
            return;
        }

        if (guess === secretNumber) {
            messageDiv.className = 'success';
            messageDiv.textContent = `🎉 Correct! The number was ${secretNumber}!`;
            endGame(true);
            return;
        } 
        
        // Deduct resources on wrong guess
        attemptsLeft--;
        score = Math.max(0, score - 10);
        attemptsSpan.textContent = attemptsLeft;
        scoreSpan.textContent = score;

        if (guess < secretNumber) {
            messageDiv.className = '';
            messageDiv.textContent = '📉 Too low! Try a higher number.';
        } else {
            messageDiv.className = '';
            messageDiv.textContent = '📈 Too high! Try a lower number.';
        }

        if (attemptsLeft <= 0) {
            messageDiv.className = 'error';
            messageDiv.textContent = `💀 Game Over! The number was ${secretNumber}.`;
            endGame(false);
        }

        guessInput.value = '';
        guessInput.focus();
    }

    function endGame(isWin) {
        gameOver = true;
        submitBtn.textContent = 'Play Again';
        submitBtn.style.backgroundColor = '#00bcd4';
        guessInput.disabled = true;
        if (typeof ArcadeSDK !== 'undefined' && ArcadeSDK.saveHighScore) {
            ArcadeSDK.saveHighScore('number-guessing', isWin ? score : 0);
        }
    }

    function resetGame() {
        secretNumber = Math.floor(Math.random() * 100) + 1;
        attemptsLeft = 7;
        score = 100;
        gameOver = false;

        attemptsSpan.textContent = attemptsLeft;
        scoreSpan.textContent = score;
        messageDiv.textContent = '';
        guessInput.value = '';
        guessInput.disabled = false;
        
        submitBtn.textContent = 'Submit Guess';
        submitBtn.style.backgroundColor = '#4caf50';
        guessInput.focus();
    }
</script>

</body>
</html>
