<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🟩 Number Guessing Game</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .game-container {
            background-color: #2a2a35;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { color: #4caf50; margin-top: 0; }
        .stats {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
            font-weight: bold;
            color: #00bcd4;
        }
        input[type="number"] {
            width: 60%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #444;
            border-radius: 6px;
            background-color: #1e1e24;
            color: white;
            text-align: center;
            outline: none;
        }
        input[type="number"]:focus { border-color: #4caf50; }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            width: 65%;
            transition: background 0.2s;
        }
        button:hover { background-color: #45a049; }
        #message {
            margin-top: 20px;
            font-size: 18px;
            min-height: 27px;
            font-weight: bold;
        }
        .error { color: #ff5252; }
        .success { color: #ffeb3b; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🟩 Guessing Game</h1>
    <p>I am thinking of a number between 1 and 100.</p>
    
    <div class="stats">
        <div>Attempts Left: <span id="attempts">7</span></div>
        <div>Score: <span id="score">100</span></div>
    </div>

    <input type="number" id="userGuess" min="1" max="100" placeholder="Enter 1-100">
    <br>
    <button id="actionBtn" onclick="checkGuess()">Submit Guess</button>
    
    <div id="message"></div>
</div>

<script>
    let secretNumber = Math.floor(Math.random() * 100) + 1;
    let attemptsLeft = 7;
    let score = 100;
    let gameOver = false;

    const guessInput = document.getElementById('userGuess');
    const messageDiv = document.getElementById('message');
    const attemptsSpan = document.getElementById('attempts');
    const scoreSpan = document.getElementById('score');
    const actionBtn = document.getElementById('actionBtn');

    // Allow pressing "Enter" key to submit
    guessInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') checkGuess();
    });

    function checkGuess() {
        if (gameOver) {
            resetGame();
            return;
        }

        let guess = parseInt(guessInput.value);

        // Validation
        if (isNaN(guess) || guess < 1 || guess > 100) {
            messageDiv.className = 'error';
            messageDiv.textContent = '❌ Enter a valid number between 1 and 100.';
            return;
        }

        if (guess === secretNumber) {
            messageDiv.className = 'success';
            messageDiv.textContent = `🎉 Correct! The number was ${secretNumber}!`;
            endGame(true);
            return;
        } 
        
        // Deduct resources on wrong guess
        attemptsLeft--;
        score -= 10;
        attemptsSpan.textContent = attemptsLeft;
        scoreSpan.textContent = score;

        if (guess < secretNumber) {
            messageDiv.className = '';
            messageDiv.textContent = '📉 Too low! Try a higher number.';
        } else {
            messageDiv.className = '';
            messageDiv.textContent = '📈 Too high! Try a lower number.';
        }

        if (attemptsLeft <= 0) {
            messageDiv.className = 'error';
            messageDiv.textContent = `💀 Game Over! The number was ${secretNumber}.`;
            endGame(false);
        }

        guessInput.value = '';
        guessInput.focus();
    }

    function endGame(isWin) {
        gameOver = true;
        actionBtn.textContent = 'Play Again';
        actionBtn.style.backgroundColor = '#00bcd4';
        guessInput.disabled = true;
    }

    function resetGame() {
        secretNumber = Math.floor(Math.random() * 100) + 1;
        attemptsLeft = 7;
        score = 100;
        gameOver = false;

        attemptsSpan.textContent = attemptsLeft;
        scoreSpan.textContent = score;
        messageDiv.textContent = '';
        guessInput.value = '';
        guessInput.disabled = false;
        
        actionBtn.textContent = 'Submit Guess';
        actionBtn.style.backgroundColor = '#4caf50';
        guessInput.focus();
    }
</script>

</body>
</html>
