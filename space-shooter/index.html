<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Shooter Pro Mini</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
<link rel="stylesheet" href="../shared/arcade-theme.css">
<script src="../shared/arcade-sdk.js"></script>
<!-- BEGIN UNIVERSAL SCALING -->

<style>
/* Universal Responsive Scaling Mod */
html {
    margin: 0 !important;
    padding: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    overflow: hidden !important;
    background: #000 !important;
}

body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    overflow: hidden !important;
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
    background: #000 !important;
}

body > .arcade-back-btn {
    position: absolute !important;
    top: 15px !important;
    left: 15px !important;
    z-index: 10000 !important;
    background: rgba(0, 0, 0, 0.5) !important;
    padding: 8px 12px !important;
    border-radius: 8px !important;
    text-decoration: none !important;
    color: #fff !important;
    font-family: sans-serif !important;
    border: 1px solid rgba(255, 255, 255, 0.2) !important;
}

.game-container, .container {
    transform-origin: center center !important;
    margin: 0 !important;
    position: relative !important;
}
</style>
<script>
function safeScale() {
    const container = document.querySelector('.game-container') || document.querySelector('.container');
    if (!container) return;
    
    // Reset transform to get accurate bounding client rect
    container.style.transform = 'none';
    
    // Some games use canvas directly for size, get inner width/height
    let cw = container.offsetWidth || 800;
    let ch = container.offsetHeight || 600;
    
    // If container is taking full width erroneously, fallback to child canvas size
    const canvas = container.querySelector('canvas');
    if (canvas && (cw > window.innerWidth || ch > window.innerHeight)) {
        cw = canvas.width || cw;
        ch = canvas.height || ch;
    }
    
    // Calculate scale to fit within viewport
    let padding = 10;
    const scaleX = window.innerWidth / (cw + padding);
    const scaleY = window.innerHeight / (ch + padding);
    
    const scale = Math.min(scaleX, scaleY);
    container.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', safeScale);
window.addEventListener('orientationchange', safeScale);
window.addEventListener('DOMContentLoaded', safeScale);
window.addEventListener('load', safeScale);
setTimeout(safeScale, 100);
setTimeout(safeScale, 500);
setTimeout(safeScale, 1000);
</script>

<!-- END UNIVERSAL SCALING -->
</head>
<body>
    <a href="../index.html" class="arcade-back-btn">&larr; Back to Arcade</a>
    <div class="game-container glass-panel">
        <div class="ui-panel">
            <div class="stat-box">SCORE: <span id="scoreValue">0</span></div>
            <div class="stat-box">WAVE: <span id="waveValue">1</span></div>
            <div class="stat-box high-score">HI-SCORE: <span id="highScoreValue">0</span></div>
        </div>
        <div class="canvas-container">
            <canvas id="gameCanvas" width="450" height="550"></canvas>
            <button id="startBtn">START GAME</button>
        </div>
        
        <div class="mobile-controls">
            <div class="dir-pad">
                <button class="ctrl-btn" id="btnLeft">&larr;</button>
                <button class="ctrl-btn" id="btnRight">&rarr;</button>
            </div>
            <button class="ctrl-btn fire-btn" id="btnFire">FIRE</button>
        </div>

        <div class="instructions">Use &larr; &rarr; arrows or A / D keys to move. Press SPACE or Touch FIRE to shoot.</div>
    </div>
    <script src="game.js"></script>
</body>
</html>
