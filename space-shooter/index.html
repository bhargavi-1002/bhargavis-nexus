<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Shooter Pro Mini</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
<link rel="stylesheet" href="../shared/arcade-theme.css">
<script src="../shared/arcade-sdk.js"></script>
<!-- BEGIN FULLSCREEN SCALING -->

<style>
/* Safe Fullscreen Scaling Mod */
html, body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    overflow: hidden !important;
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
}

body > .arcade-back-btn {
    position: absolute !important;
    top: 10px !important;
    left: 10px !important;
    z-index: 10000 !important;
}

.game-container, .container {
    transform-origin: center;
    margin: 0 !important;
}
</style>
<script>
function safeScale() {
    const container = document.querySelector('.game-container, .container');
    if (!container) return;
    
    container.style.transform = 'none';
    const rect = container.getBoundingClientRect();
    const cw = rect.width || 800;
    const ch = rect.height || 600;
    
    // allow a little padding
    let padding = 10;
    const scaleX = window.innerWidth / (cw + padding);
    const scaleY = window.innerHeight / (ch + padding);
    
    const scale = Math.min(scaleX, scaleY);
    container.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', safeScale);
window.addEventListener('orientationchange', safeScale);
setTimeout(safeScale, 50);
setTimeout(safeScale, 300);
</script>

<!-- END FULLSCREEN SCALING -->
</head>
<body>
    <a href="../index.html" class="arcade-back-btn">&larr; Back to Arcade</a>
    <div class="game-container glass-panel">
        <div class="ui-panel">
            <div class="stat-box">SCORE: <span id="scoreValue">0</span></div>
            <div class="stat-box">WAVE: <span id="waveValue">1</span></div>
            <div class="stat-box high-score">HI-SCORE: <span id="highScoreValue">0</span></div>
        </div>
        <div class="canvas-container">
            <canvas id="gameCanvas" width="450" height="550"></canvas>
            <button id="startBtn">START GAME</button>
        </div>
        
        <div class="mobile-controls">
            <div class="dir-pad">
                <button class="ctrl-btn" id="btnLeft">&larr;</button>
                <button class="ctrl-btn" id="btnRight">&rarr;</button>
            </div>
            <button class="ctrl-btn fire-btn" id="btnFire">FIRE</button>
        </div>

        <div class="instructions">Use &larr; &rarr; arrows or A / D keys to move. Press SPACE or Touch FIRE to shoot.</div>
    </div>
    <script src="game.js"></script>
</body>
</html>
