<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Shooter Pro Mini</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
<link rel="stylesheet" href="../shared/arcade-theme.css">
<script src="../shared/arcade-sdk.js"></script>
<!-- BEGIN FULLSCREEN MOD -->

<style>
/* Injected by Fullscreen Mod */
html, body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    overflow: hidden !important;
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
    background-color: var(--bg-color, #0b0f19) !important;
}

body > .arcade-back-btn {
    z-index: 10000;
}

#gameCanvas, canvas {
    max-width: 100vw !important;
    max-height: 100vh !important;
    width: auto !important;
    height: auto !important;
    object-fit: contain !important;
}

.container, .game-container {
    width: 100vw !important;
    height: 100vh !important;
    max-width: 100% !important;
    max-height: 100% !important;
    border-radius: 0 !important;
    box-sizing: border-box !important;
    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;
    align-items: center !important;
    border: none !important;
}
</style>
<script>
// Auto-scale content for portrait and landscape
function adjustScale() {
    const containers = document.querySelectorAll('.container, .game-container, canvas');
    containers.forEach(el => {
        // Just let CSS handle the full width/height
    });
}
window.addEventListener('resize', adjustScale);
window.addEventListener('orientationchange', adjustScale);
adjustScale();
</script>

<!-- END FULLSCREEN MOD -->
</head>
<body>
    <a href="../index.html" class="arcade-back-btn">&larr; Back to Arcade</a>
    <div class="game-container glass-panel">
        <div class="ui-panel">
            <div class="stat-box">SCORE: <span id="scoreValue">0</span></div>
            <div class="stat-box">WAVE: <span id="waveValue">1</span></div>
            <div class="stat-box high-score">HI-SCORE: <span id="highScoreValue">0</span></div>
        </div>
        <div class="canvas-container">
            <canvas id="gameCanvas" width="450" height="550"></canvas>
            <button id="startBtn">START GAME</button>
        </div>
        
        <div class="mobile-controls">
            <div class="dir-pad">
                <button class="ctrl-btn" id="btnLeft">&larr;</button>
                <button class="ctrl-btn" id="btnRight">&rarr;</button>
            </div>
            <button class="ctrl-btn fire-btn" id="btnFire">FIRE</button>
        </div>

        <div class="instructions">Use &larr; &rarr; arrows or A / D keys to move. Press SPACE or Touch FIRE to shoot.</div>
    </div>
    <script src="game.js"></script>
</body>
</html>
