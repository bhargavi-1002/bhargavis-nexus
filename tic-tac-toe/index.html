<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ Cyber Tic Tac Toe Pro</title>
    <link rel="stylesheet" href="../shared/arcade-theme.css">
    <script src="../shared/arcade-sdk.js"></script>
    <meta name="description" content="Play the ultimate Neon Cyber Tic Tac Toe game. Challenge a friend local-coop or take on the un-beatable Minimax neural network matrix AI.">
    <meta name="keywords" content="tic tac toe, play tic tac toe, unbeatable ai, neon web games, retro arcade">
    <meta name="robots" content="index, follow">
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="🎮 Cyber Tic Tac Toe Pro - Play Online Arcade">
    <meta property="og:description" content="Engage against modular algorithms across three tactical difficulty stages with retro audio feeds.">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">



    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-color: #131a26;
            --border-color: #1e293b;
            --cyan-neon: #00bfff;
            --green-neon: #00ff88;
            --pink-neon: #ff0055;
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
        }

        .arcade-back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            z-index: 100;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--panel-color);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .header { text-align: center; margin-bottom: 20px; }
        
        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--cyan-neon);
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(0, 191, 255, 0.2);
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.2);
            padding: 5px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .mode-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .mode-btn.active {
            background: var(--cyan-neon);
            color: var(--bg-color);
            box-shadow: 0 0 10px rgba(0, 191, 255, 0.3);
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: center;
        }

        .score-item { flex: 1; }
        .player-label { display: block; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
        .score { font-size: 1.3rem; font-weight: 700; font-family: monospace; }
        #scoreX { color: var(--green-neon); }
        #scoreDraw { color: var(--text-main); }
        #scoreO { color: var(--pink-neon); }

        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 15px;
            min-height: 35px;
        }

        .current-player { color: var(--text-main); }
        .current-player span { font-weight: 800; color: var(--cyan-neon); }

        .difficulty label { font-size: 0.8rem; color: var(--text-muted); margin-right: 5px; }
        .difficulty select {
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
            outline: none;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
            aspect-ratio: 1 / 1;
        }

        .cell {
            background: #0d131f;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.15s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            aspect-ratio: 1 / 1;
        }

        .cell:hover { border-color: var(--cyan-neon); }
        .cell.x { color: var(--green-neon); text-shadow: 0 0 10px rgba(0, 255, 136, 0.3); }
        .cell.o { color: var(--pink-neon); text-shadow: 0 0 10px rgba(255, 0, 85, 0.3); }

        .btn-restart {
            background: transparent;
            border: 2px solid var(--cyan-neon);
            color: var(--cyan-neon);
            padding: 12px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-restart:hover {
            background: var(--cyan-neon);
            color: var(--bg-color);
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.4);
        }

        /* End Game Alert Overlay Container Layout */
        .game-over {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.95);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
            animation: fadeIn 0.25s ease forwards;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .game-over-content { text-align: center; }
        .game-over-content h2 { font-size: 2rem; color: var(--cyan-neon); margin-bottom: 10px; }
        .game-over-content p { color: var(--text-muted); font-size: 1rem; margin-bottom: 20px; font-family: monospace; }
        .game-over-content button { max-width: 200px; }
    </style>
</head>
<body>
    <a href="../index.html" class="arcade-back-btn">← Back to Arcade</a>

    <div class="container glass-panel">
        <div class="header">
            <h1>🎮 CYBER TAC TOE</h1>
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="friend">👥 vs Friend</button>
                <button class="mode-btn" data-mode="ai">🤖 vs AI</button>
            </div>
        </div>

        <div class="score-board">
            <div class="score-item">
                <span class="player-label">Player X</span>
                <span class="score" id="scoreX">0</span>
            </div>
            <div class="score-item">
                <span class="player-label">Draws</span>
                <span class="score" id="scoreDraw">0</span>
            </div>
            <div class="score-item">
                <span class="player-label">Player O</span>
                <span class="score" id="scoreO">0</span>
            </div>
        </div>

        <div class="game-info">
            <div class="current-player">
                Current Player: <span id="currentPlayer">X</span>
            </div>
            <div class="difficulty" id="difficultyContainer" style="display: none;">
                <label for="difficultySelect">AI Difficulty:</label>
                <select id="difficultySelect">
                    <option value="easy">Easy</option>
                    <option value="medium" selected>Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
        </div>

        <div class="game-board" id="gameBoard">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <div class="game-over" id="gameOver" style="display: none;">
            <div class="game-over-content">
                <h2 id="gameOverMessage">Game Over!</h2>
                <p id="gameOverDetails"></p>
                <button class="btn-restart" id="restartBtn">Play Again</button>
            </div>
        </div>

        <button class="btn-restart main-restart" id="mainRestartBtn">🔄 Restart Game</button>
    </div>

    <script>
        const gameBoard = document.getElementById('gameBoard');
        const cells = document.querySelectorAll('.cell');
        const currentPlayerSpan = document.getElementById('currentPlayer');
        const modeButtons = document.querySelectorAll('.mode-btn');
        const difficultyContainer = document.getElementById('difficultyContainer');
        const difficultySelect = document.getElementById('difficultySelect');
        const gameOverDiv = document.getElementById('gameOver');
        const gameOverMessage = document.getElementById('gameOverMessage');
        const gameOverDetails = document.getElementById('gameOverDetails');
        const restartBtn = document.getElementById('restartBtn');
        const mainRestartBtn = document.getElementById('mainRestartBtn');

        const scoreXSpan = document.getElementById('scoreX');
        const scoreDrawSpan = document.getElementById('scoreDraw');
        const scoreOSpan = document.getElementById('scoreO');

        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let isGameActive = true;
        let gameMode = 'friend'; // 'friend' or 'ai'
        let aiDifficulty = 'medium'; // 'easy', 'medium', 'hard'
        
        let scores = { X: 0, draw: 0, O: 0 };

        const winPatterns = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
            [0, 4, 8], [2, 4, 6]             // Diagonals
        ];

        // --- SYNTHESIZED WEB AUDIO TIMBRES ---
        let audioCtx = null;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function playNote(freq, type, duration, vol, slide) {
            try {
                initAudio(); if (!audioCtx) return;
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                if(slide) osc.frequency.exponentialRampToValueAtTime(slide, audioCtx.currentTime + duration);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }
        
        function soundTapX() { playNote(440, "sine", 0.05, 0.05, 550); }
        function soundTapO() { playNote(330, "sine", 0.08, 0.05, 220); }
        function soundReset() { playNote(600, "triangle", 0.04, 0.04); }
        function soundDraw() { playNote(140, "sawtooth", 0.3, 0.06, 90); }
        function soundWin() {
            let chain = [523.25, 659.25, 783.99, 1046.50];
            chain.forEach((f, i) => setTimeout(() => playNote(f, "sine", 0.2, 0.06), i * 80));
        }

        // Card Click Routing Handles
        cells.forEach(cell => cell.addEventListener('click', () => handleCellClick(cell)));
        
        modeButtons.forEach(btn => btn.addEventListener('click', function() {
            soundReset();
            modeButtons.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            gameMode = this.dataset.mode;
            difficultyContainer.style.display = gameMode === 'ai' ? 'block' : 'none';
            resetBoard();
        }));

        difficultySelect.addEventListener('change', (e) => {
            aiDifficulty = e.target.value;
            resetBoard();
        });

        restartBtn.addEventListener('click', () => { soundReset(); resetBoard(); });
        mainRestartBtn.addEventListener('click', () => { soundReset(); resetBoard(); });

        function handleCellClick(cell) {
            const index = cell.dataset.index;
            if (board[index] !== '' || !isGameActive || (gameMode === 'ai' && currentPlayer === 'O')) return;

            makeMove(index, currentPlayer);

            if (isGameActive && gameMode === 'ai') {
                setTimeout(makeAiMove, 400);
            }
        }

        function makeMove(index, player) {
            board[index] = player;
            cells[index].textContent = player;
            cells[index].classList.add(player.toLowerCase());
            
            if (player === 'X') soundTapX(); else soundTapO();

            checkGameState();
            if (isGameActive) {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                currentPlayerSpan.textContent = currentPlayer;
            }
        }

        function checkGameState() {
            let roundWon = false;
            let winningPattern = null;

            for (let i = 0; i < winPatterns.length; i++) {
                const [a, b, c] = winPatterns[i];
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    roundWon = true;
                    winningPattern = winPatterns[i];
                    break;
                }
            }

            if (roundWon) {
                isGameActive = false;
                scores[currentPlayer]++;
                updateScoreBoard();
                soundWin();
                if (typeof ArcadeSDK !== 'undefined') {
                    ArcadeSDK.saveHighScore('tic-tac-toe', scores.X * 100);
                }
                showGameOver(`${currentPlayer} DOMINATES!`, `Successfully cleared matrix row sequence.`);
                return;
            }

            if (!board.includes('')) {
                isGameActive = false;
                scores.draw++;
                updateScoreBoard();
                soundDraw();
                if (typeof ArcadeSDK !== 'undefined') {
                    ArcadeSDK.saveHighScore('tic-tac-toe', scores.X * 100);
                }
                showGameOver("GRID TIE DETECTED", "Matrix allocation filled with zero variable outcomes.");
                return;
            }
        }

        function updateScoreBoard() {
            scoreXSpan.textContent = scores.X;
            scoreDrawSpan.textContent = scores.draw;
            scoreOSpan.textContent = scores.O;
        }

        function showGameOver(msg, details) {
            gameOverMessage.textContent = msg;
            gameOverDetails.textContent = details;
            gameOverDiv.style.display = 'flex';
        }

        function resetBoard() {
            board = ['', '', '', '', '', '', '', '', ''];
            isGameActive = true;
            currentPlayer = 'X';
            currentPlayerSpan.textContent = 'X';
            gameOverDiv.style.display = 'none';
            cells.forEach(cell => {
                cell.textContent = '';
                cell.className = 'cell';
            });
        }

        // --- ARTIFICIAL INTELLIGENCE MATRIX ---
        function makeAiMove() {
            if (!isGameActive) return;
            let targetIndex;

            if (aiDifficulty === 'easy') {
                targetIndex = getRandomMove();
            } else if (aiDifficulty === 'medium') {
                targetIndex = Math.random() > 0.4 ? getOptimalMove() : getRandomMove();
            } else {
                targetIndex = getBestMinimaxMove();
            }

            if (targetIndex !== undefined && targetIndex !== null) {
                makeMove(targetIndex, 'O');
            }
        }

        function getRandomMove() {
            let empties = board.map((val, idx) => val === '' ? idx : null).filter(val => val !== null);
            return empties[Math.floor(Math.random() * empties.length)];
        }

        function getOptimalMove() {
            // Priority 1: Check if AI can win immediately
            for (let pattern of winPatterns) {
                let vals = pattern.map(i => board[i]);
                if (vals.filter(v => v === 'O').length === 2 && vals.filter(v => v === '').length === 1) {
                    return pattern[vals.indexOf('')];
                }
            }
            // Priority 2: Block human winning vector lines
            for (let pattern of winPatterns) {
                let vals = pattern.map(i => board[i]);
                if (vals.filter(v => v === 'X').length === 2 && vals.filter(v => v === '').length === 1) {
                    return pattern[vals.indexOf('')];
                }
            }
            return getRandomMove();
        }

        function getBestMinimaxMove() {
            let bestScore = -Infinity;
            let move;
            for (let i = 0; i < 9; i++) {
                if (board[i] === '') {
                    board[i] = 'O';
                    let score = minimax(board, 0, false);
                    board[i] = '';
                    if (score > bestScore) {
                        bestScore = score;
                        move = i;
                    }
                }
            }
            return move;
        }

        function minimax(currBoard, depth, isMaximizing) {
            let result = evaluateBoard();
            if (result !== null) return result;

            if (isMaximizing) {
                let bestScore = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (currBoard[i] === '') {
                        currBoard[i] = 'O';
                        let score = minimax(currBoard, depth + 1, false);
                        currBoard[i] = '';
                        bestScore = Math.max(score, bestScore);
                    }
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (currBoard[i] === '') {
                        currBoard[i] = 'X';
                        let score = minimax(currBoard, depth + 1, true);
                        currBoard[i] = '';
                        bestScore = Math.min(score, bestScore);
                    }
                }
                return bestScore;
            }
        }

        function evaluateBoard() {
            for (let pattern of winPatterns) {
                if (board[pattern[0]] && board[pattern[0]] === board[pattern[1]] && board[pattern[0]] === board[pattern[2]]) {
                    return board[pattern[0]] === 'O' ? 10 : -10;
                }
            }
            if (!board.includes('')) return 0;
            return null;
        }
    </script>
</body>
</html>
