<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Puzzle - Mate in 1</title>
    <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../shared/arcade-theme.css">
<script src="../shared/arcade-sdk.js"></script>

<!-- BEGIN FULLSCREEN MOD -->

<style>
/* Injected by Fullscreen Mod */
html, body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    overflow: hidden !important;
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
    background-color: var(--bg-color, #0b0f19) !important;
}

body > .arcade-back-btn {
    z-index: 10000;
}

#gameCanvas, canvas {
    max-width: 100vw !important;
    max-height: 100vh !important;
    width: auto !important;
    height: auto !important;
    object-fit: contain !important;
}

.container, .game-container {
    width: 100vw !important;
    height: 100vh !important;
    max-width: 100% !important;
    max-height: 100% !important;
    border-radius: 0 !important;
    box-sizing: border-box !important;
    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;
    align-items: center !important;
    border: none !important;
}
</style>
<script>
// Auto-scale content for portrait and landscape
function adjustScale() {
    const containers = document.querySelectorAll('.container, .game-container, canvas');
    containers.forEach(el => {
        // Just let CSS handle the full width/height
    });
}
window.addEventListener('resize', adjustScale);
window.addEventListener('orientationchange', adjustScale);
adjustScale();
</script>

<!-- END FULLSCREEN MOD -->
</head>
<body>
    <a href="../index.html" class="arcade-back-btn">← Back to Arcade</a>
    <div class="container glass-panel">
        <div class="header">
            <h1>♚ Chess Puzzle - Mate in 1 ♚</h1>
            <p class="instruction">Find the checkmate in one move!</p>
        </div>

        <div class="game-info glass-panel">
            <div class="turn">Turn: <span id="currentTurn">White</span></div>
            <div class="status" id="gameStatus"></div>
        </div>

        <div class="game-container glass-panel">
            <div id="chessboard" class="chessboard"></div>
        </div>

        <div class="controls glass-panel">
            <button id="resetBtn" class="btn">Reset Puzzle</button>
            <button id="nextPuzzleBtn" class="btn">Next Puzzle</button>
        </div>

        <div class="puzzle-info">
            <h3>Puzzle #1</h3>
            <p>White to move. Find checkmate in 1 move.</p>
        </div>
    </div>

    <script src="chess.js"></script>
    <script src="aiEngine.js"></script>
    <script src="puzzleEngine.js"></script>
    <script src="script.js"></script>
</body>
</html>
