<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Puzzle - Mate in 1</title>
    <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../shared/arcade-theme.css">
<script src="../shared/arcade-sdk.js"></script>

<!-- BEGIN UNIVERSAL SCALING -->

<style>
/* Universal Responsive Scaling Mod */
html {
    margin: 0 !important;
    padding: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    overflow: hidden !important;
    background: #000 !important;
}

body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    overflow: hidden !important;
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
    background: #000 !important;
}

body > .arcade-back-btn {
    position: absolute !important;
    top: 15px !important;
    left: 15px !important;
    z-index: 10000 !important;
    background: rgba(0, 0, 0, 0.5) !important;
    padding: 8px 12px !important;
    border-radius: 8px !important;
    text-decoration: none !important;
    color: #fff !important;
    font-family: sans-serif !important;
    border: 1px solid rgba(255, 255, 255, 0.2) !important;
}

.game-container, .container {
    transform-origin: center center !important;
    margin: 0 !important;
    position: relative !important;
}
</style>
<script>
function safeScale() {
    const container = document.querySelector('.game-container') || document.querySelector('.container');
    if (!container) return;
    
    // Reset transform to get accurate bounding client rect
    container.style.transform = 'none';
    
    // Some games use canvas directly for size, get inner width/height
    let cw = container.offsetWidth || 800;
    let ch = container.offsetHeight || 600;
    
    // If container is taking full width erroneously, fallback to child canvas size
    const canvas = container.querySelector('canvas');
    if (canvas && (cw > window.innerWidth || ch > window.innerHeight)) {
        cw = canvas.width || cw;
        ch = canvas.height || ch;
    }
    
    // Calculate scale to fit within viewport
    let padding = 10;
    const scaleX = window.innerWidth / (cw + padding);
    const scaleY = window.innerHeight / (ch + padding);
    
    const scale = Math.min(scaleX, scaleY);
    container.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', safeScale);
window.addEventListener('orientationchange', safeScale);
window.addEventListener('DOMContentLoaded', safeScale);
window.addEventListener('load', safeScale);
setTimeout(safeScale, 100);
setTimeout(safeScale, 500);
setTimeout(safeScale, 1000);
</script>

<!-- END UNIVERSAL SCALING -->
</head>
<body>
    <a href="../index.html" class="arcade-back-btn">← Back to Arcade</a>
    <div class="container glass-panel">
        <div class="header">
            <h1>♚ Chess Puzzle - Mate in 1 ♚</h1>
            <p class="instruction">Find the checkmate in one move!</p>
        </div>

        <div class="game-info glass-panel">
            <div class="turn">Turn: <span id="currentTurn">White</span></div>
            <div class="status" id="gameStatus"></div>
        </div>

        <div class="game-container glass-panel">
            <div id="chessboard" class="chessboard"></div>
        </div>

        <div class="controls glass-panel">
            <button id="resetBtn" class="btn">Reset Puzzle</button>
            <button id="nextPuzzleBtn" class="btn">Next Puzzle</button>
        </div>

        <div class="puzzle-info">
            <h3>Puzzle #1</h3>
            <p>White to move. Find checkmate in 1 move.</p>
        </div>
    </div>

    <script src="chess.js"></script>
    <script src="aiEngine.js"></script>
    <script src="puzzleEngine.js"></script>
    <script src="script.js"></script>
</body>
</html>
